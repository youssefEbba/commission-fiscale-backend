# MinIO pour développement local.
# Identifiants : MINIO_ROOT_USER et MINIO_ROOT_PASSWORD dans un fichier .env (non versionné) à côté
# de ce fichier, repris dans application-local.properties (minio.access-key / minio.secret-key).
# Démarrage : docker compose -f docker-compose.minio.yml up -d
# API S3 : http://127.0.0.1:9000  |  Console web : http://127.0.0.1:9001
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
    volumes:
      - minio_sgci_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 40); do
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null && break;
        sleep 1;
      done;
      mc mb local/documents --ignore-existing;
      echo 'Bucket documents pret.';
      "

volumes:
  minio_sgci_data:
