name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests
        run: mvn -B test
      - name: SonarQube
        if: ${{ vars.ENABLE_SONAR == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          ARGS=(-Dsonar.projectKey=commission-fiscale-backend)
          if [ -n "$SONAR_ORGANIZATION" ]; then
            ARGS+=(-Dsonar.organization="$SONAR_ORGANIZATION")
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar "${ARGS[@]}"
      - name: Snyk (optionnel)
        if: ${{ vars.ENABLE_SNYK == 'true' }}
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
