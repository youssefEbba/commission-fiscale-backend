name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy backend locally
        run: |
          set -e

          cd /home/mf/commission-fiscale-backend

          mkdir -p /home/mf/deploy-backups

          # Sauvegarder les fichiers locaux du serveur
          cp src/main/resources/application-prod.properties /home/mf/deploy-backups/application-prod.properties.server || true
          cp Dockerfile /home/mf/deploy-backups/Dockerfile.backend.server || true

          # Mettre à jour le code depuis GitHub avec token
          git fetch https://x-access-token:${{ secrets.GH_PAT }}@github.com/youssefEbba/commission-fiscale-backend.git main
          git reset --hard FETCH_HEAD

          # Remettre la configuration locale serveur
          cp /home/mf/deploy-backups/application-prod.properties.server src/main/resources/application-prod.properties || true
          cp /home/mf/deploy-backups/Dockerfile.backend.server Dockerfile || true

          # Rebuild et redémarrage backend
          cd /home/mf/commission-fiscale-deploy
          sudo docker compose up -d --build backend

          sudo docker ps
          sudo docker logs --tail=80 commission-backend
