name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Échec du job seulement si le scanner plante. Les CVE transitives
      # (Boot 3.5) sont suivies dans Snyk ; OSV les affiche dans le résumé.
      - name: OSV Scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --lockfile=./pom.xml
      - name: OSV — scanner indisponible
        if: steps.osv.outcome == 'failure' && steps.osv.conclusion == 'failure'
        run: |
          echo "OSV a signalé des findings ou une erreur : voir l'étape précédente." >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # p/spring n'existe pas (404) et faisait échouer le job en 2 s.
      - name: Semgrep
        run: semgrep scan --config p/java --severity ERROR --error --metrics=off
