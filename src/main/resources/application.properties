# Application (commun à tous les profils)
spring.application.name=sgci-backend
server.port=8080
# JWT volumineux (ex. PRESIDENT ~190 permissions) : évite HTTP 400 « Request header is too large »
server.max-http-request-header-size=65536

# Profil par défaut : local (développement). Production : SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (dialecte commun)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Développement (profil local) : valeurs par défaut si application-local.properties est absent ---
# Vous pouvez surcharger via src/main/resources/application-local.properties (fichier ignoré par Git).
# allowPublicKeyRetrieval=true : souvent nécessaire pour MySQL 8 (Ubuntu / caching_sha2_password)
spring.datasource.url=jdbc:mysql://localhost:3306/sgci_db_n?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Journaux : DEBUG au besoin dans application-local.properties, jamais en production.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Secrets : aucun dans ce fichier. Ils viennent de l'environnement (voir variables-environnement.example)
# ou, sur un poste de développement, d'application-local.properties. En production, un secret absent
# arrête le démarrage (SecuriteAuDemarrage) ; hors production, la clé JWT absente est tirée au hasard.
app.jwt.secret=${APP_JWT_SECRET:}
# 8 heures : une journée de travail (24 h avant la revue de sécurité)
app.jwt.expiration-ms=28800000
# JWT commission relais (impersonation) — TTL plus court (4 h par défaut)
app.jwt.relais-expiration-ms=14400000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- APIs de change (externes, non maîtrisées) ---
# En panne réseau / quota : erreur HTTP 503 + code EXTERNAL_EXCHANGE_SERVICE_UNAVAILABLE côté API REST.
app.exchange-rate.base=MRU
app.exchange-rate.url=https://open.er-api.com/v6/latest/{base}

app.exchangerate.host.url=https://api.exchangerate.host
app.exchangerate.host.access-key=${APP_EXCHANGERATE_HOST_ACCESS_KEY:}

# --- Stockage fichiers ---
# minio (défaut) : nécessite MinIO joignable ; sinon 503 OBJECT_STORAGE_UNAVAILABLE sur upload.
# local : écrit sous app.upload.dir, URLs relatives /api/local-files/{nom} (téléchargement authentifié).
app.storage.backend=${APP_STORAGE_BACKEND:minio}
# Dossier uploads (mode local + réserve)
app.upload.dir=uploads

# MinIO (ignoré si app.storage.backend=local)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:documents}

# Données et comptes de démonstration : actifs hors production, jamais en production
# (DataInitializer.comptesDeDemonstration / donneesDeDemonstration). Surcharges possibles :
#   app.seed.comptes-demo.enabled, app.seed.demande-correction.enabled,
#   app.seed.utilisation-credit-demo.enabled, app.seed.certificat-ouvert.enabled
# Les enregistrements déjà présents en base ne sont pas supprimés.
app.seed.certificat-ouvert.enabled=true
# Compte « admin » initial, créé s'il n'existe pas : en production, mot de passe obligatoire ici.
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=false

# --- E-mail (Spring Boot auto-config JavaMailSender) ---
# Mot de passe : application-local.properties ou SPRING_MAIL_PASSWORD (jamais en Git).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:emine.youbah@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:emine.youbah@gmail.com}
