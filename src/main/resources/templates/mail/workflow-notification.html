<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SGCI — Notification</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
<p>Bonjour,</p>
<p th:text="${message}">Message</p>
<p th:if="${dossierLabel != null and !#strings.isEmpty(dossierLabel)}">
    <strong>Dossier :</strong> <span th:text="${dossierLabel}"></span>
</p>
<p th:if="${newStatus != null}">
    <strong>Statut :</strong> <span th:text="${newStatus}"></span>
</p>
<p th:if="${motif != null and !#strings.isEmpty(motif)}">
    <strong>Motif :</strong> <span th:text="${motif}"></span>
</p>
<p style="color:#666;font-size:12px;margin-top:24px;">
    Commission Fiscale — SGCI<br/>
    Événement : <span th:text="${eventCode}"></span>
</p>
</body>
</html>
