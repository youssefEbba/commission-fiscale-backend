<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SGCI — Demande refusée</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
<p>Bonjour <span th:text="${username}">utilisateur</span>,</p>
<p>Votre demande de réinitialisation de mot de passe a été <strong>refusée</strong> par l'administrateur.</p>
<p th:if="${motif != null and !#strings.isEmpty(motif)}">
    <strong>Motif :</strong> <span th:text="${motif}"></span>
</p>
<p>Si vous pensez qu'il s'agit d'une erreur, contactez l'administrateur du système.</p>
<p style="color:#666;font-size:12px;margin-top:24px;">
    Commission Fiscale — SGCI
</p>
</body>
</html>
