# Production — lancer avec : export SPRING_PROFILES_ACTIVE=prod
app.seed.certificat-ouvert.enabled=false
# (sinon le profil par défaut reste "local" avec utilisateur root depuis application.properties)
#
# MySQL (phpMyAdmin / serveur) — surcharge possible : SPRING_DATASOURCE_URL, USERNAME, PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sgci_db_n?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin@1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# E-mail SMTP (Gmail) — mot de passe via SPRING_MAIL_PASSWORD, jamais en clair dans Git
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:emine.youbah@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:emine.youbah@gmail.com}
# IMPORTANT : en production, laisser VIDE pour envoyer aux vrais destinataires.
# Renseigner uniquement pour rediriger tous les mails vers une boîte de test.
app.mail.override-recipient=${APP_MAIL_OVERRIDE_RECIPIENT:}
